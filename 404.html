<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Página que muestra GitHub Pages cuando alguien entra a una dirección que no existe -->
  <title>Página no encontrada | RECTEC Servicios</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E4878">
  <link rel="icon" type="image/png" href="/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

    <div class="contenedor encabezado-fila">

            <a class="boton boton-naranja" href="/">Ir al inicio</a>
